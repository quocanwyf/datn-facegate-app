      description: "Q-007: 1 <= match_min,unknown_min,spoof_min <= window_size (server kiểm quan hệ). W nguyên dương. Bật chỉ sau T13/chốt L; L trong [0,1] và không NULL. Sai trả 422, giữ cấu hình cũ. Mặc định W/MATCH/UNKNOWN/SPOOF=5/3/4/3."
      allOf:
      - if:
          required: [anti_spoof_enabled]
          properties:
            anti_spoof_enabled:
              const: true
        then:
          required: [liveness_threshold]
          properties:
            liveness_threshold:
              type: number
              minimum: 0
              maximum: 1
