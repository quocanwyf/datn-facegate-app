openapi: 3.1.0
info:
  title: Hub API — Chấm công & ra vào bằng khuôn mặt (bản demo ĐATN)
  version: 1.1.1
  description: 'Hợp đồng API giữa Hub (FastAPI) với Web (`/admin`, `/me`) và Kiosk App. Theo `03-app/dac-ta-app.md` v1.4.4 §8 và `db/thiet-ke-db.md`.


    - Mọi đường dẫn có tiền tố `/api/v1`. Bản demo chạy HTTP trong LAN.

    - `x-roles`: vai trò được gọi (`public` = không cần đăng nhập, `any` = mọi người đã đăng nhập, `device` = Kiosk). Server luôn kiểm quyền +
    phạm vi phòng ban (MANAGER).

    - Thời gian ISO-8601 có múi giờ; ngày công tính theo múi giờ công ty.

    - Phân trang: `page` (từ 1), `size` (≤ 100) → `{items,total,page,size}`.

    - WebSocket `/api/v1/ws/kiosk` và `/api/v1/ws/monitor`: xem `openapi/ws-protocol.md`.'
servers:
- url: http://localhost:8000/api/v1
  description: dev trên máy Hy
- url: http://10.0.2.2:8000/api/v1
  description: từ máy ảo Android tới Hub trên cùng máy
security:
- bearerAuth: []
tags:
- name: Auth
  description: Đăng nhập, token
- name: Me
  description: Trang nhân viên /me
- name: Dashboard
  description: W-02
- name: Employees
  description: Nhân viên, nghỉ việc, xoá dữ liệu khuôn mặt
- name: Organization
  description: Phòng ban, tài khoản, vai trò, PIN
- name: Faces
  description: Hồ sơ khuôn mặt chờ xác nhận
- name: Gates
  description: Cửa, thiết bị, mở cửa thủ công
- name: Kiosk
  description: API cho Kiosk App (device token)
- name: Schedule
  description: Ca, phân ca, ngày lễ
- name: Attendance
  description: Ngày công, giải trình, chấm công hộ, xuất Excel
- name: Events
  description: Sự kiện nhận dạng, cảnh báo
- name: Settings
  description: Cấu hình nhận dạng, mô hình, nhật ký
- name: System
  description: Tình trạng Hub
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Đăng nhập
      x-roles:
      - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
      security: []
      operationId: postAuthLogin
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Đổi refresh token lấy cặp token mới (xoay vòng)
      x-roles:
      - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/E401'
      security: []
      operationId: postAuthRefresh
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Đăng xuất (thu hồi refresh token)
      x-roles:
      - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Không có nội dung
        '401':
          $ref: '#/components/responses/E401'
      operationId: postAuthLogout
  /auth/change-password:
    post:
      tags:
      - Auth
      summary: Đổi mật khẩu
      x-roles:
      - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      responses:
        '204':
          description: Không có nội dung
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '422':
          $ref: '#/components/responses/E422'
      operationId: postAuthChangePassword
  /me:
    get:
      tags:
      - Me
      summary: Thông tin người đang đăng nhập
      x-roles:
      - any
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
        '401':
          $ref: '#/components/responses/E401'
      operationId: getMe
  /me/today:
    get:
      tags:
      - Me
      summary: E-02 Hôm nay
      x-roles:
      - EMPLOYEE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeToday'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
      operationId: getMeToday
  /me/attendance:
    get:
      tags:
      - Me
      summary: E-03 Bảng công tháng
      x-roles:
      - EMPLOYEE
      parameters:
      - $ref: '#/components/parameters/month'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeMonth'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
      operationId: getMeAttendance
  /me/days/{date}:
    get:
      tags:
      - Me
      summary: E-04 Chi tiết ngày
      x-roles:
      - EMPLOYEE
      parameters:
      - name: date
        in: path
        required: true
        schema: &id005
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeDay'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
      operationId: getMeDaysById
  /me/requests:
    get:
      tags:
      - Me
      summary: E-06 Giải trình của tôi
      x-roles:
      - EMPLOYEE
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/RequestStatus'
      - &id001
        $ref: '#/components/parameters/page'
      - &id002
        $ref: '#/components/parameters/size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAttendanceRequest'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
      operationId: getMeRequests
    post:
      tags:
      - Me
      summary: E-05 Gửi giải trình
      x-roles:
      - EMPLOYEE
      description: 409 REQUEST_PENDING_EXISTS nếu ngày đã có giải trình chờ; 422 PERIOD_CLOSED nếu ngày đã quá cửa sổ cho phép.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequestCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRequest'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
      operationId: postMeRequests
  /me/requests/{id}/cancel:
    post:
      tags:
      - Me
      summary: Huỷ giải trình đang chờ
      x-roles:
      - EMPLOYEE
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRequest'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
      operationId: postMeRequestsCancel
  /me/face:
    get:
      tags:
      - Me
      summary: E-08 Trạng thái dữ liệu khuôn mặt
      x-roles:
      - EMPLOYEE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeFace'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
      operationId: getMeFace
  /me/face/revoke:
    post:
      tags:
      - Me
      summary: 'Rút đồng ý: xoá dữ liệu khuôn mặt, chuyển sang chấm công hộ'
      x-roles:
      - EMPLOYEE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeFace'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
      operationId: postMeFaceRevoke
      description: "Q-005/Q-006: từ chối consent (agree=false), rút hoặc xóa hành chính xóa ACTIVE/PENDING, mẫu/vector/crop liên kết, NULL face_consent_at/by cùng nhau và chuyển MANUAL; TERMINATED xóa sinh trắc, giữ trạng thái nghỉ việc. Giữ công/event; ngừng nhận dạng dữ liệu đã rút/xóa. File xóa lỗi: 503 BIOMETRIC_DELETE_INCOMPLETE, báo chưa hoàn tất và cho thử lại, không khôi phục nhận dạng; gallery reload lỗi: 503 RECOGNITION_UNAVAILABLE. Đồng ý lại ghi consent mới, không thay hồ sơ ACTIVE trước khi duyệt mới."
  /dashboard/today:
    get:
      tags:
      - Dashboard
      summary: W-02 Số liệu hôm nay
      x-roles: &id003
      - OWNER
      - HR
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
      operationId: getDashboardToday
      description: "Q-012: ba chỉ số nhân viên chỉ ACTIVE có ca hôm nay, loại HOLIDAY/LEAVE/OFF, đếm người duy nhất. Có mặt: check_in; Đi muộn: trong Có mặt, check_in>start+grace_in; Chưa đến: đã tới start chưa check_in. Lượt người lạ: số event UNKNOWN occurred_at trong ngày timezone công ty, không SPOOF; chỉ số trong ngày tạm thời."
  /employees:
    get:
      tags:
      - Employees
      summary: Danh sách nhân viên
      x-roles:
      - OWNER
      - HR
      - MANAGER
      - SECURITY
      description: MANAGER chỉ thấy NV thuộc phòng ban mình quản lý. Q-014 SECURITY chỉ tra cứu ACTIVE/MANUAL với id, code, full_name, department_id, department_name, status, attendance_method; vai trò khác giữ quyền riêng. GET chi tiết không mở cho SECURITY.
      parameters:
      - name: q
        in: query
        schema: &id004
          type: string
        description: tên hoặc mã
      - $ref: '#/components/parameters/department_id'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/EmployeeStatus'
      - name: attendance_method
        in: query
        schema:
          $ref: '#/components/schemas/AttendanceMethod'
      - name: face_profile_status
        in: query
        schema:
          type: string
          enum:
          - NONE
          - PENDING_REVIEW
          - ACTIVE
          - REJECTED
      - *id001
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEmployee'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
      operationId: getEmployees
    post:
      tags:
      - Employees
      summary: Thêm nhân viên
      x-roles: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCreated'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
      operationId: postEmployees
  /employees/{id}:
    get:
      tags:
      - Employees
      summary: Chi tiết nhân viên
      x-roles:
      - OWNER
      - HR
      - MANAGER
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      operationId: getEmployeesById
    patch:
      tags:
      - Employees
      summary: Sửa nhân viên
      x-roles: *id003
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
      operationId: patchEmployeesById
  /employees/{id}/suspend:
    post:
      tags:
      - Employees
      summary: Tạm khoá
      x-roles: *id003
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
      operationId: postEmployeesSuspend
  /employees/{id}/reactivate:
    post:
      tags:
      - Employees
      summary: Mở khoá
      x-roles: *id003
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
      operationId: postEmployeesReactivate
  /employees/{id}/terminate:
    post:
      tags:
      - Employees
      summary: 'Nghỉ việc: xoá ngay dữ liệu khuôn mặt, giữ dữ liệu chấm công'
      x-roles: *id003
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
      operationId: postEmployeesTerminate
      description: "Q-005/Q-006: từ chối consent (agree=false), rút hoặc xóa hành chính xóa ACTIVE/PENDING, mẫu/vector/crop liên kết, NULL face_consent_at/by cùng nhau và chuyển MANUAL; TERMINATED xóa sinh trắc, giữ trạng thái nghỉ việc. Giữ công/event; ngừng nhận dạng dữ liệu đã rút/xóa. File xóa lỗi: 503 BIOMETRIC_DELETE_INCOMPLETE, báo chưa hoàn tất và cho thử lại, không khôi phục nhận dạng; gallery reload lỗi: 503 RECOGNITION_UNAVAILABLE. Đồng ý lại ghi consent mới, không thay hồ sơ ACTIVE trước khi duyệt mới."
  /employees/{id}/face:
    delete:
      tags:
      - Employees
      summary: Xoá dữ liệu khuôn mặt (ảnh mẫu, embedding, template, crop liên quan)
      x-roles: *id003
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Không có nội dung
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '503':
          $ref: '#/components/responses/E503'
      operationId: deleteEmployeesFace
      description: "Q-005/Q-006: từ chối consent (agree=false), rút hoặc xóa hành chính xóa ACTIVE/PENDING, mẫu/vector/crop liên kết, NULL face_consent_at/by cùng nhau và chuyển MANUAL; TERMINATED xóa sinh trắc, giữ trạng thái nghỉ việc. Giữ công/event; ngừng nhận dạng dữ liệu đã rút/xóa. File xóa lỗi: 503 BIOMETRIC_DELETE_INCOMPLETE, báo chưa hoàn tất và cho thử lại, không khôi phục nhận dạng; gallery reload lỗi: 503 RECOGNITION_UNAVAILABLE. Đồng ý lại ghi consent mới, không thay hồ sơ ACTIVE trước khi duyệt mới."
  /departments:
    get:
      tags:
      - Organization
      summary: Danh sách phòng ban
      x-roles:
      - OWNER
      - HR
      - MANAGER
      - SECURITY
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
      operationId: getDepartments
    post:
      tags:
      - Organization
      summary: Thêm phòng ban
      x-roles: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
      operationId: postDepartments
  /departments/{id}:
    patch:
      tags:
      - Organization
      summary: Đổi tên phòng ban
      x-roles: *id003
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
      operationId: patchDepartmentsById
  /users:
    get:
      tags:
      - Organization
      summary: Danh sách tài khoản
      x-roles: *id003
      parameters:
      - name: q
        in: query
        schema: *id004
      - *id001
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUser'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
      operationId: getUsers
    post:
      tags:
      - Organization
      summary: Tạo tài khoản (trả mật khẩu tạm 1 lần)
      x-roles: *id003
      description: HR không được cấp vai trò OWNER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  temporary_password: *id004
                required:
                - user
                - temporary_password
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
      operationId: postUsers
  /users/{id}:
    patch:
      tags:
      - Organization
      summary: Sửa tài khoản
      x-roles: *id003
