components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token 15 phút.
    deviceToken:
      type: http
      scheme: bearer
      description: Device token của Kiosk (30 ngày).
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    id:
      name: id
      in: path
      required: true
      schema: *id007
    from:
      name: from
      in: query
      schema: *id005
    to:
      name: to
      in: query
      schema: *id005
    month:
      name: month
      in: query
      required: true
      schema:
        type: string
        pattern: ^\d{4}-\d{2}$
    department_id:
      name: department_id
      in: query
      schema: *id007
    employee_id:
      name: employee_id
      in: query
      schema: *id007
  responses:
    E400:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E401:
      description: Chưa xác thực / token hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E403:
      description: Không đủ quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E404:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E409:
      description: Xung đột (trùng)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E422:
      description: Vi phạm quy tắc nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E429:
      description: Quá số lần thử
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E503:
      description: Thao tác chưa hoàn tất hoặc nhận dạng chưa sẵn sàng; có thể thử lại sau khi phục hồi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: *id004
            message: *id004
            details:
              type: object
              additionalProperties: true
          required:
          - code
          - message
      required:
      - error
      description: Mọi lỗi. `code` là mã máy đọc (vd. PAIRING_EXPIRED, ASSIGNMENT_OVERLAP, REQUEST_PENDING_EXISTS, SELF_REVIEW_FORBIDDEN, MODEL_NOT_VERIFIED);
        `message` tiếng Việt hiển thị được.
    Role:
      type: string
      enum:
      - OWNER
      - HR
      - MANAGER
      - SECURITY
      - EMPLOYEE
    RoleGrant:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/Role'
        scope_department_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - role
